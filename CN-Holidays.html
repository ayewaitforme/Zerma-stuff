<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2025 Year Calendar with Holidays</title>
  <link rel="stylesheet" href="style.css"> <!-- Link to the shared CSS -->
</head>
<body>

<h1>2025 Calendar with Holidays</h1>
<table id="calendar">
  <thead>
    <tr>
      <th>Sun</th>
      <th>Mon</th>
      <th>Tue</th>
      <th>Wed</th>
      <th>Thu</th>
      <th>Fri</th>
      <th>Sat</th>
    </tr>
  </thead>
  <tbody>
    <!-- Calendar will be populated here by JavaScript -->
  </tbody>
</table>

<script>
// Fetch holidays data from the CN-Holidays.json file
fetch('CN-Holidays.json')
  .then(response => response.json())
  .then(holidays => {
    // Function to create a month view
    function createMonth(year, month) {
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const firstDayOfMonth = new Date(year, month, 1).getDay();

      const monthCalendar = [];
      let week = new Array(7).fill(null);

      for (let day = 1; day <= daysInMonth; day++) {
        const dayOfWeek = (firstDayOfMonth + day - 1) % 7;
        week[dayOfWeek] = day;

        if (dayOfWeek === 6 || day === daysInMonth) {
          monthCalendar.push(week);
          week = new Array(7).fill(null);
        }
      }

      return monthCalendar;
    }

    // Function to populate the calendar with months
    function populateCalendar() {
      const year = 2025;
      const calendarBody = document.querySelector('#calendar tbody');
      const months = [
        'January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'
      ];

      for (let month = 0; month < 12; month++) {
        const monthCalendar = createMonth(year, month);
        const monthHeader = document.createElement('tr');
        const monthName = document.createElement('td');
        monthName.colSpan = 7;
        monthName.textContent = months[month];
        monthHeader.appendChild(monthName);
        calendarBody.appendChild(monthHeader);

        monthCalendar.forEach(week => {
          const weekRow = document.createElement('tr');
          week.forEach(day => {
            const dayCell = document.createElement('td');
            if (day) {
              const dateStr = `${year}-${(month + 1).toString().padStart(2, '0')}-${day.toString().padStart(2, '0')}`;
              dayCell.textContent = day;

              // Check if it's a holiday or an adjusted workday
              holidays.forEach(holiday => {
                if (holiday.dates_off.includes(dateStr)) {
                  dayCell.classList.add('holiday');
                }
                if (holiday.adjusted_workdays.includes(dateStr)) {
                  dayCell.classList.add('adjusted-workday');
                }
              });
            }
            weekRow.appendChild(dayCell);
          });
          calendarBody.appendChild(weekRow);
        });
      }
    }

    // Initialize the calendar on page load
    populateCalendar();
  })
  .catch(error => console.error('Error fetching holidays data:', error));
</script>

</body>
</html>

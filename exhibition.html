<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exhibitions</title>
  <link rel="stylesheet" href="style.css"> <!-- Link to the shared CSS -->
</head>
<body>

<div id="exhibitions"></div>
<button id="toggle-button">See All Exhibitions</button>

<script>
  const today = new Date();
  let showingAll = false;

  async function loadExhibitions(showAll = false) {
    const res = await fetch('exhibitions.json');
    const exhibitions = await res.json();

    const container = document.getElementById('exhibitions');
    container.innerHTML = ''; // Clear old cards

    let filteredExhibitions = showAll
      ? exhibitions
      : exhibitions.filter(exhibition => new Date(exhibition.endDate) >= today);

    // Limit to 4 only when not showing all
    if (!showAll) {
      filteredExhibitions = filteredExhibitions.slice(0, 4);
    }

    if (filteredExhibitions.length === 0) {
      container.innerHTML = '<p>No exhibitions to show.</p>';
      return;
    }

    filteredExhibitions.forEach(exhibition => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = ` 
        <div class="card-title">${exhibition.title}</div>
        <div class="card-info">
          ${exhibition.booth ? `Booth: ${exhibition.booth}<br>` : 'Booth TBD<br>'}
          ${exhibition.location}, ${exhibition.country}<br>
          ${exhibition.startDate} to ${exhibition.endDate}
        </div>
        <a class="card-link" href="${exhibition.website}" target="_blank">Visit Website</a>
      `;
      container.appendChild(card);
    });
  }

  document.getElementById('toggle-button').addEventListener('click', () => {
    showingAll = !showingAll;
    loadExhibitions(showingAll);
    document.getElementById('toggle-button').textContent = showingAll
      ? 'Show Upcoming Only'
      : 'See All Exhibitions';
  });

  // Initial load: show upcoming exhibitions
  loadExhibitions();
</script>

</body>
</html>

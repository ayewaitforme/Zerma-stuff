<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exhibitions</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 40px;
      background-color: #f0f0f0;
      min-height: 100vh;
    }
    #exhibitions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      width: 100%;
    }
    .card {
      width: 400px;
      height: 200px;
      background-color: white;
      border: 1px solid #ccc;
      border-radius: 10px;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.1);
      padding: 15px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-10px);
      box-shadow: 4px 4px 15px rgba(0,0,0,0.2);
    }
    .card-title {
      font-size: 18px;
      font-weight: bold;
      color: #333;
    }
    .card-info {
      font-size: 14px;
      color: #666;
    }
    .card-link {
      margin-top: 10px;
      text-decoration: none;
      color: #007BFF;
      font-weight: bold;
    }
    .card-link:hover {
      text-decoration: underline;
    }
    #toggle-button {
      margin-top: 20px;
      padding: 12px 25px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background-color: #007BFF;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    #toggle-button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

<div id="exhibitions"></div>
<button id="toggle-button">See All Exhibitions</button>

<script>
  const today = new Date();
  let showingAll = false;

  async function loadExhibitions(showAll = false) {
    const res = await fetch('exhibitions.json');
    const exhibitions = await res.json();

    const container = document.getElementById('exhibitions');
    container.innerHTML = ''; // Clear old cards

    let filteredExhibitions = showAll
      ? exhibitions
      : exhibitions.filter(exhibition => new Date(exhibition.endDate) >= today);

    // Limit to 4 only when not showing all
    if (!showAll) {
      filteredExhibitions = filteredExhibitions.slice(0, 4);
    }

    if (filteredExhibitions.length === 0) {
      container.innerHTML = '<p>No exhibitions to show.</p>';
      return;
    }

    filteredExhibitions.forEach(exhibition => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-title">${exhibition.title}</div>
        <div class="card-info">
          ${exhibition.booth ? `Booth: ${exhibition.booth}<br>` : 'Booth TBD<br>'}
          ${exhibition.location}, ${exhibition.country}<br>
          ${exhibition.startDate} to ${exhibition.endDate}
        </div>
        <a class="card-link" href="${exhibition.website}" target="_blank">Visit Website</a>
      `;
      container.appendChild(card);
    });
  }

  document.getElementById('toggle-button').addEventListener('click', () => {
    showingAll = !showingAll;
    loadExhibitions(showingAll);
    document.getElementById('toggle-button').textContent = showingAll
      ? 'Show Upcoming Only'
      : 'See All Exhibitions';
  });

  // Initial load: show upcoming exhibitions
  loadExhibitions();
</script>

</body>
</html>
